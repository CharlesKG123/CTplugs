<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>CT PLUGS | Find Legitimate Ways to Earn Money Online</title>
    <meta name="description" content="Discover curated microtask platforms, transcription websites, freelance marketplaces, remote jobs, AI training opportunities, and survey sites — all in one place.">
    <meta name="keywords" content="best microtask websites, make money online, online jobs, work from home jobs, transcription jobs, AI training jobs, remote jobs, online jobs for beginners, freelance websites">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-emerald-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- INITIAL DATA STORE ---
        const INITIAL_CATEGORIES = [
            { id: 'micro-jobs', name: 'Micro Jobs', icon: 'check-square', description: 'Small online tasks such as data collection, categorization, research, and simple digital tasks.' },
            { id: 'transcription', name: 'Transcription', icon: 'headphones', description: 'Websites where users can earn money by converting audio and video into text.' },
            { id: 'ai-training', name: 'AI Training', icon: 'cpu', description: 'Platforms offering data annotation, AI evaluation, image labeling, audio labeling, and AI prompt feedback.' },
            { id: 'freelancing', name: 'Freelancing', icon: 'briefcase', description: 'Platforms where users can offer skills such as graphic design, writing, programming, video editing, and virtual assistance.' },
            { id: 'remote-jobs', name: 'Remote Jobs', icon: 'globe', description: 'Websites where users can find legitimate work-from-home and remote employment opportunities.' },
            { id: 'surveys', name: 'Surveys & Research', icon: 'bar-chart-2', description: 'Platforms where users can participate in surveys, focus groups, and consumer market research.' },
            { id: 'creative', name: 'Creative Work', icon: 'palette', description: 'Opportunities for designers, animators, video editors, photographers, writers, and musicians.' },
            { id: 'online-selling', name: 'Online Selling', icon: 'shopping-bag', description: 'Platforms that allow users to sell physical products, digital downloads, artwork, or customized merchandise online.' }
        ];

        const INITIAL_PLATFORMS = [
            {
                id: '1',
                name: 'Remotasks (Outlier)',
                category: 'ai-training',
                logo: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=120&auto=format&fit=crop&q=80',
                shortDescription: 'Help train modern AI models by evaluating outputs, writing prompts, and annotating data sets.',
                overview: 'Outlier (formerly Remotasks) connects human evaluators with generative AI models to improve model performance and reasoning.',
                typeOfWork: 'AI Evaluation & Data Annotation',
                difficulty: 'Beginner Friendly',
                earningPotential: '$15 - $40 / hr',
                countries: 'Global (US, UK, CA, ZA, IN, PH, etc.)',
                paymentMethods: 'PayPal, AirTM',
                minPayout: '$5.00',
                affiliateUrl: 'https://outlier.ai/?ref=ctplugs',
                featured: true,
                rating: 4.8,
                verified: true,
                lastUpdated: '2026-08-01',
                pros: ['Flexible hours', 'Good hourly rates for complex tasks', 'Weekly payouts'],
                cons: ['Task availability fluctuates', 'Strict quality checks'],
                howItWorks: 'Complete an initial skills assessment, join project queues, and get paid weekly for verified tasks completed.'
            },
            {
                id: '2',
                name: 'Rev',
                category: 'transcription',
                logo: 'https://images.unsplash.com/photo-1590602847861-f357a9332bbc?w=120&auto=format&fit=crop&q=80',
                shortDescription: 'Earn money creating audio transcriptions, captions, and subtitling files online.',
                overview: 'Rev is a well-established transcription marketplace that allows remote freelancers to convert audio/video files into text.',
                typeOfWork: 'Audio Transcription & Captioning',
                difficulty: 'Intermediate',
                earningPotential: '$0.30 - $1.10 / audio min',
                countries: 'Select Global Countries',
                paymentMethods: 'PayPal',
                minPayout: '$1.00',
                affiliateUrl: 'https://rev.com/?ref=ctplugs',
                featured: true,
                rating: 4.5,
                verified: true,
                lastUpdated: '2026-07-28',
                pros: ['Reliable weekly PayPal payments', 'Large volume of available work', 'Great learning resources'],
                cons: ['Requires good typing speed and accuracy', 'Acceptance rate varies by location'],
                howItWorks: 'Pass a grammar and transcription test, choose audio jobs that interest you, submit work, and get paid weekly.'
            },
            {
                id: '3',
                name: 'Upwork',
                category: 'freelancing',
                logo: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=120&auto=format&fit=crop&q=80',
                shortDescription: 'The largest global freelance network connecting specialists with client businesses.',
                overview: 'Upwork lets professionals bid on contract positions ranging from web design and coding to virtual assistance and copywriting.',
                typeOfWork: 'Freelance Services',
                difficulty: 'Intermediate to Advanced',
                earningPotential: '$10 - $150+ / hr',
                countries: 'Worldwide',
                paymentMethods: 'Direct Deposit, PayPal, Payoneer, Wire',
                minPayout: '$100.00 (Variable)',
                affiliateUrl: 'https://upwork.com/?ref=ctplugs',
                featured: true,
                rating: 4.9,
                verified: true,
                lastUpdated: '2026-08-05',
                pros: ['High earning ceiling', 'Escrow protection for secure payments', 'Global client base'],
                cons: ['High competition', 'Connects system requires upfront investment'],
                howItWorks: 'Create a detailed profile, purchase Connects to submit proposals, negotiate rates, deliver work, and get paid.'
            },
            {
                id: '4',
                name: 'Clickworker',
                category: 'micro-jobs',
                logo: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=120&auto=format&fit=crop&q=80',
                shortDescription: 'Microtasks platform offering text creation, web research, data entry, and UHRS tasks.',
                overview: 'Clickworker provides microtask solutions to global clients, offering users small microtask items that require human intelligence.',
                typeOfWork: 'Microtasks & UHRS',
                difficulty: 'Beginner Friendly',
                earningPotential: '$8 - $18 / hr',
                countries: 'Worldwide',
                paymentMethods: 'Paypal, Payoneer',
                minPayout: '$10.00',
                affiliateUrl: 'https://clickworker.com/?ref=ctplugs',
                featured: true,
                rating: 4.3,
                verified: true,
                lastUpdated: '2026-07-20',
                pros: ['Very low entry barrier', 'Access to Microsoft UHRS platform', 'Flexible working schedule'],
                cons: ['Payment processing takes up to 21 days', 'Task volume varies by region'],
                howItWorks: 'Sign up, complete user evaluations, gain access to specialized project dashboards like UHRS, and earn cash.'
            }
        ];

        const INITIAL_ANALYTICS = {
            totalViews: 1840,
            uniqueVisitors: 1120,
            linkClicks: 430,
            pageBreakdown: {
                home: 890,
                directory: 540,
                detail: 280,
                compare: 130
            },
            topClickedPlatforms: {
                'Remotasks (Outlier)': 195,
                'Rev': 120,
                'Upwork': 115
            }
        };

        const DEFAULT_ADMIN_PASSWORD = 'admin'; // Passcode for admin panel

        // --- MAIN APP COMPONENT ---
        function App() {
            const [view, setView] = useState('home');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedPlatformId, setSelectedPlatformId] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            // Admin Auth State
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);

            // Analytics state
            const [analytics, setAnalytics] = useState(() => {
                const saved = localStorage.getItem('ctplugs_analytics');
                return saved ? JSON.parse(saved) : INITIAL_ANALYTICS;
            });

            // Platforms state
            const [platforms, setPlatforms] = useState(() => {
                const saved = localStorage.getItem('ctplugs_platforms');
                return saved ? JSON.parse(saved) : INITIAL_PLATFORMS;
            });

            // Filters
            const [difficultyFilter, setDifficultyFilter] = useState('all');
            const [paymentFilter, setPaymentFilter] = useState('all');

            // Track page views
            useEffect(() => {
                setAnalytics(prev => {
                    const isUnique = !sessionStorage.getItem('ctplugs_visited');
                    if (isUnique) sessionStorage.setItem('ctplugs_visited', 'true');

                    const updated = {
                        ...prev,
                        totalViews: prev.totalViews + 1,
                        uniqueVisitors: isUnique ? prev.uniqueVisitors + 1 : prev.uniqueVisitors,
                        pageBreakdown: {
                            ...prev.pageBreakdown,
                            [view]: (prev.pageBreakdown[view] || 0) + 1
                        }
                    };
                    localStorage.setItem('ctplugs_analytics', JSON.stringify(updated));
                    return updated;
                });
            }, [view]);

            useEffect(() => {
                localStorage.setItem('ctplugs_platforms', JSON.stringify(platforms));
            }, [platforms]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [view, selectedCategory, selectedPlatformId, showAuthModal, isAdminLoggedIn]);

            const trackOutboundClick = (platformName) => {
                setAnalytics(prev => {
                    const updated = {
                        ...prev,
                        linkClicks: prev.linkClicks + 1,
                        topClickedPlatforms: {
                            ...prev.topClickedPlatforms,
                            [platformName]: (prev.topClickedPlatforms[platformName] || 0) + 1
                        }
                    };
                    localStorage.setItem('ctplugs_analytics', JSON.stringify(updated));
                    return updated;
                });
            };

            const selectedPlatform = useMemo(() => {
                return platforms.find(p => p.id === selectedPlatformId) || platforms[0];
            }, [platforms, selectedPlatformId]);

            const filteredPlatforms = useMemo(() => {
                return platforms.filter(p => {
                    const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;
                    const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          p.shortDescription.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          p.typeOfWork.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesDifficulty = difficultyFilter === 'all' || p.difficulty === difficultyFilter;
                    const matchesPayment = paymentFilter === 'all' || p.paymentMethods.toLowerCase().includes(paymentFilter.toLowerCase());

                    return matchesCategory && matchesSearch && matchesDifficulty && matchesPayment;
                });
            }, [platforms, selectedCategory, searchQuery, difficultyFilter, paymentFilter]);

            const navigateToDetail = (id) => {
                setSelectedPlatformId(id);
                setView('detail');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const navigateToCategory = (catId) => {
                setSelectedCategory(catId);
                setView('directory');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleAdminAccess = () => {
                if (isAdminLoggedIn) {
                    setView('admin');
                } else {
                    setShowAuthModal(true);
                }
            };

            return (
                <div className="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100">
                    {/* Header */}
                    <header className="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                {/* Logo */}
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => { setView('home'); setSelectedCategory('all'); }}>
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-emerald-500/20">
                                        CT
                                    </div>
                                    <div className="flex flex-col">
                                        <span className="font-extrabold text-xl tracking-tight text-white leading-none">CT PLUGS</span>
                                        <span className="text-[10px] text-emerald-400 font-medium tracking-wider uppercase">Verified Opportunities</span>
                                    </div>
                                </div>

                                {/* Navigation */}
                                <nav className="hidden lg:flex items-center space-x-6 text-sm font-medium text-slate-300">
                                    <button onClick={() => { setView('home'); setSelectedCategory('all'); }} className={`hover:text-emerald-400 transition ${view === 'home' ? 'text-emerald-400 font-bold' : ''}`}>Home</button>
                                    <button onClick={() => navigateToCategory('micro-jobs')} className="hover:text-emerald-400 transition">Micro Jobs</button>
                                    <button onClick={() => navigateToCategory('transcription')} className="hover:text-emerald-400 transition">Transcription</button>
                                    <button onClick={() => navigateToCategory('ai-training')} className="hover:text-emerald-400 transition">AI Training</button>
                                    <button onClick={() => navigateToCategory('freelancing')} className="hover:text-emerald-400 transition">Freelancing</button>
                                    <button onClick={() => navigateToCategory('remote-jobs')} className="hover:text-emerald-400 transition">Remote Jobs</button>
                                    <button onClick={() => { setView('directory'); setSelectedCategory('all'); }} className={`hover:text-emerald-400 transition ${view === 'directory' ? 'text-emerald-400 font-bold' : ''}`}>Directory</button>
                                    <button onClick={() => setView('compare')} className={`hover:text-emerald-400 transition ${view === 'compare' ? 'text-emerald-400 font-bold' : ''}`}>Compare</button>
                                </nav>

                                {/* Action Buttons */}
                                <div className="hidden lg:flex items-center space-x-3">
                                    <button 
                                        onClick={handleAdminAccess} 
                                        className={`text-xs font-semibold px-3 py-2 border rounded-xl transition flex items-center space-x-1.5 ${
                                            isAdminLoggedIn 
                                            ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' 
                                            : 'text-slate-300 border-slate-700 hover:bg-slate-800'
                                        }`}
                                    >
                                        <i data-lucide={isAdminLoggedIn ? "unlock" : "lock"} className="w-3.5 h-3.5"></i>
                                        <span>{isAdminLoggedIn ? 'Admin Panel' : 'Admin Login'}</span>
                                    </button>
                                </div>

                                {/* Mobile Hamburger */}
                                <div className="lg:hidden flex items-center space-x-2">
                                    <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 text-slate-300 hover:text-white focus:outline-none">
                                        <i data-lucide={isMobileMenuOpen ? "x" : "menu"} className="w-6 h-6"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Menu */}
                        {isMobileMenuOpen && (
                            <div className="lg:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-6 space-y-3">
                                <button onClick={() => { setView('home'); setIsMobileMenuOpen(false); }} className="block w-full text-left py-2 font-semibold text-slate-200">Home</button>
                                <button onClick={() => { navigateToCategory('micro-jobs'); setIsMobileMenuOpen(false); }} className="block w-full text-left py-2 text-slate-400">Micro Jobs</button>
                                <button onClick={() => { navigateToCategory('transcription'); setIsMobileMenuOpen(false); }} className="block w-full text-left py-2 text-slate-400">Transcription</button>
                                <button onClick={() => { navigateToCategory('ai-training'); setIsMobileMenuOpen(false); }} className="block w-full text-left py-2 text-slate-400">AI Training</button>
                                <button onClick={() => { navigateToCategory('freelancing'); setIsMobileMenuOpen(false); }} className="block w-full text-left py-2 text-slate-400">Freelancing</button>
                                <button onClick={() => { handleAdminAccess(); setIsMobileMenuOpen(false); }} className="block w-full text-left py-2 text-emerald-400 font-bold">Admin Area (Restricted)</button>
                            </div>
                        )}
                    </header>

                    {/* MAIN VIEW CONTROLLER */}
                    <main className="flex-grow">
                        {view === 'home' && (
                            <HomePage 
                                setView={setView} 
                                navigateToCategory={navigateToCategory} 
                                platforms={platforms}
                                navigateToDetail={navigateToDetail}
                                setSearchQuery={setSearchQuery}
                                searchQuery={searchQuery}
                                trackOutboundClick={trackOutboundClick}
                            />
                        )}

                        {view === 'directory' && (
                            <DirectoryPage 
                                platforms={filteredPlatforms} 
                                selectedCategory={selectedCategory}
                                setSelectedCategory={setSelectedCategory}
                                searchQuery={searchQuery}
                                setSearchQuery={setSearchQuery}
                                navigateToDetail={navigateToDetail}
                                difficultyFilter={difficultyFilter}
                                setDifficultyFilter={setDifficultyFilter}
                                paymentFilter={paymentFilter}
                                setPaymentFilter={setPaymentFilter}
                                trackOutboundClick={trackOutboundClick}
                            />
                        )}

                        {view === 'detail' && (
                            <PlatformDetailPage 
                                platform={selectedPlatform} 
                                setView={setView} 
                                navigateToCategory={navigateToCategory}
                                trackOutboundClick={trackOutboundClick}
                            />
                        )}

                        {view === 'compare' && (
                            <ComparePage platforms={platforms} navigateToDetail={navigateToDetail} />
                        )}

                        {view === 'admin' && (
                            isAdminLoggedIn ? (
                                <AdminDashboard 
                                    platforms={platforms} 
                                    setPlatforms={setPlatforms} 
                                    analytics={analytics}
                                    setIsAdminLoggedIn={setIsAdminLoggedIn}
                                />
                            ) : (
                                <ProtectedAdminPrompt setShowAuthModal={setShowAuthModal} />
                            )
                        )}
                    </main>

                    {/* ADMIN LOGIN MODAL */}
                    {showAuthModal && (
                        <AdminLoginModal 
                            setShowAuthModal={setShowAuthModal} 
                            setIsAdminLoggedIn={setIsAdminLoggedIn} 
                            setView={setView}
                        />
                    )}

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 text-sm border-t border-slate-800 pt-10 pb-8">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-4">
                            <div className="flex justify-center space-x-6 text-xs">
                                <button onClick={() => setView('home')} className="hover:text-white">Home</button>
                                <button onClick={() => setView('directory')} className="hover:text-white">Directory</button>
                                <button onClick={handleAdminAccess} className="hover:text-emerald-400 font-semibold">Admin Area</button>
                            </div>
                            <p className="text-xs text-slate-500">© {new Date().getFullYear()} CT PLUGS. Curated remote job directory and visitor statistics.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        // --- AUTH MODAL ---
        function AdminLoginModal({ setShowAuthModal, setIsAdminLoggedIn, setView }) {
            const [passwordInput, setPasswordInput] = useState('');
            const [error, setError] = useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === DEFAULT_ADMIN_PASSWORD) {
                    setIsAdminLoggedIn(true);
                    setShowAuthModal(false);
                    setView('admin');
                } else {
                    setError(true);
                }
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-800">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center">
                                    <i data-lucide="shield-check" className="w-5 h-5"></i>
                                </div>
                                <h3 className="font-extrabold text-white text-lg">Admin Authentication</h3>
                            </div>
                            <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-white">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        <p className="text-xs text-slate-400 mb-6 leading-relaxed">
                            Access real-time traffic statistics, visitor click-through rates, and live referral links. Enter password to continue.
                        </p>

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-300 mb-1">Admin Passcode</label>
                                <input 
                                    type="password" 
                                    required 
                                    placeholder="Enter passcode (Default: admin)"
                                    value={passwordInput}
                                    onChange={(e) => { setPasswordInput(e.target.value); setError(false); }}
                                    className="w-full px-3 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                />
                                {error && <p className="text-rose-400 text-xs mt-1">Invalid passcode. Try again.</p>}
                            </div>

                            <button type="submit" className="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-bold rounded-xl text-xs shadow-lg transition">
                                Unlock Dashboard
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- PROTECTED ADMIN PROMPT ---
        function ProtectedAdminPrompt({ setShowAuthModal }) {
            return (
                <div className="max-w-md mx-auto my-20 p-8 bg-slate-900 rounded-2xl border border-slate-800 text-center shadow-xl">
                    <div className="w-12 h-12 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="lock" className="w-6 h-6"></i>
                    </div>
                    <h2 className="text-xl font-bold text-white">Admin Authentication Required</h2>
                    <p className="text-xs text-slate-400 mt-2 mb-6">Log in to view live visitor counts, affiliate link conversions, and manage database items.</p>
                    <button onClick={() => setShowAuthModal(true)} className="px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 text-xs font-bold rounded-xl hover:from-emerald-600 hover:to-teal-600 shadow transition">
                        Open Passcode Prompt
                    </button>
                </div>
            );
        }

        // --- HOMEPAGE COMPONENT ---
        function HomePage({ setView, navigateToCategory, platforms, navigateToDetail, setSearchQuery, searchQuery, trackOutboundClick }) {
            const featuredPlatforms = platforms.filter(p => p.featured);

            return (
                <div>
                    {/* Hero Section with Vibrant Dark Gradient */}
                    <section className="relative overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950/40 text-white py-24 px-4 sm:px-6 lg:px-8 border-b border-slate-800">
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="max-w-4xl mx-auto text-center space-y-6 relative z-10">
                            <span className="inline-flex items-center px-3.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                Verified Online Opportunities Directory
                            </span>
                            <h1 className="text-4xl sm:text-6xl font-black tracking-tight leading-tight">
                                Find Legitimate Ways to Earn Money Online
                            </h1>
                            <p className="text-base sm:text-lg text-slate-400 max-w-2xl mx-auto leading-relaxed">
                                Curated microtask platforms, transcription websites, freelance marketplaces, remote jobs, AI training opportunities, and survey sites — all in one place.
                            </p>

                            {/* Search Bar */}
                            <div className="max-w-2xl mx-auto mt-8">
                                <div className="relative flex items-center">
                                    <input 
                                        type="text" 
                                        placeholder="Search microtasks, transcription, AI training..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        onKeyDown={(e) => { if (e.key === 'Enter') setView('directory'); }}
                                        className="w-full pl-12 pr-28 py-4 bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 rounded-xl shadow-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
                                    />
                                    <i data-lucide="search" className="w-5 h-5 absolute left-4 text-slate-500"></i>
                                    <button onClick={() => setView('directory')} className="absolute right-2 px-4 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-bold rounded-lg transition">
                                        Search
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Featured Section */}
                    <section className="py-16 bg-slate-950">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-end mb-10">
                                <div>
                                    <span className="text-xs font-bold uppercase tracking-wider text-emerald-400">Curated Selection</span>
                                    <h2 className="text-2xl sm:text-3xl font-extrabold text-white">Featured Opportunities</h2>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {featuredPlatforms.map(platform => (
                                    <PlatformCard key={platform.id} platform={platform} navigateToDetail={navigateToDetail} trackOutboundClick={trackOutboundClick} />
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Category Grid */}
                    <section className="py-16 bg-slate-900/50 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <h2 className="text-2xl font-bold text-white mb-8">Browse By Work Type</h2>
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                {INITIAL_CATEGORIES.map(cat => (
                                    <div 
                                        key={cat.id} 
                                        onClick={() => navigateToCategory(cat.id)}
                                        className="p-5 bg-slate-900 border border-slate-800 hover:border-emerald-500/50 rounded-2xl cursor-pointer transition group"
                                    >
                                        <div className="w-10 h-10 rounded-xl bg-slate-800 text-emerald-400 group-hover:bg-emerald-500 group-hover:text-slate-950 flex items-center justify-center mb-3 transition">
                                            <i data-lucide={cat.icon} className="w-5 h-5"></i>
                                        </div>
                                        <h3 className="font-bold text-sm text-white">{cat.name}</h3>
                                        <p className="text-[11px] text-slate-400 mt-1 line-clamp-2">{cat.description}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                </div>
            );
        }

        // --- PLATFORM CARD ---
        function PlatformCard({ platform, navigateToDetail, trackOutboundClick }) {
            return (
                <div className="bg-slate-900 rounded-2xl border border-slate-800 p-6 flex flex-col justify-between hover:border-slate-700 transition group shadow-lg">
                    <div>
                        <div className="flex items-start space-x-4 mb-4">
                            <img src={platform.logo} alt={platform.name} className="w-12 h-12 rounded-xl object-cover border border-slate-800 flex-shrink-0" />
                            <div>
                                <h3 className="font-bold text-white text-base group-hover:text-emerald-400 transition">{platform.name}</h3>
                                <span className="inline-block mt-1 px-2 py-0.5 bg-slate-800 text-slate-400 text-[10px] font-semibold rounded uppercase tracking-wider">
                                    {platform.category}
                                </span>
                            </div>
                        </div>

                        <p className="text-xs text-slate-400 leading-relaxed mb-4 line-clamp-2">
                            {platform.shortDescription}
                        </p>
                    </div>

                    <div className="space-y-3 pt-3 border-t border-slate-800/80">
                        <div className="flex justify-between text-xs text-slate-400">
                            <span>Earnings:</span>
                            <span className="font-bold text-emerald-400">{platform.earningPotential}</span>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                            <button onClick={() => navigateToDetail(platform.id)} className="w-full text-center text-xs font-semibold py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition">
                                Details
                            </button>
                            <a 
                                href={platform.affiliateUrl} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                onClick={() => trackOutboundClick(platform.name)}
                                className="w-full text-center text-xs font-bold py-2.5 px-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 rounded-xl transition flex items-center justify-center space-x-1"
                            >
                                <span>Visit Site</span>
                                <i data-lucide="external-link" className="w-3 h-3"></i>
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        // --- DIRECTORY PAGE ---
        function DirectoryPage({ platforms, selectedCategory, setSelectedCategory, searchQuery, setSearchQuery, navigateToDetail, trackOutboundClick }) {
            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                    <h1 className="text-3xl font-extrabold text-white mb-6">Opportunities Directory</h1>
                    
                    {/* Category Tabs */}
                    <div className="flex space-x-2 overflow-x-auto pb-4 mb-6 custom-scrollbar">
                        <button 
                            onClick={() => setSelectedCategory('all')} 
                            className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedCategory === 'all' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-900 text-slate-400 hover:text-white'}`}
                        >
                            All Categories
                        </button>
                        {INITIAL_CATEGORIES.map(cat => (
                            <button 
                                key={cat.id} 
                                onClick={() => setSelectedCategory(cat.id)}
                                className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${selectedCategory === cat.id ? 'bg-emerald-500 text-slate-950' : 'bg-slate-900 text-slate-400 hover:text-white'}`}
                            >
                                {cat.name}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {platforms.map(platform => (
                            <PlatformCard key={platform.id} platform={platform} navigateToDetail={navigateToDetail} trackOutboundClick={trackOutboundClick} />
                        ))}
                    </div>
                </div>
            );
        }

        // --- PLATFORM DETAIL PAGE ---
        function PlatformDetailPage({ platform, setView, trackOutboundClick }) {
            return (
                <div className="max-w-4xl mx-auto px-4 py-10">
                    <button onClick={() => setView('directory')} className="text-xs font-semibold text-slate-400 hover:text-white mb-6 flex items-center">
                        <i data-lucide="arrow-left" className="w-4 h-4 mr-1"></i> Back to Directory
                    </button>
                    <div className="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-xl space-y-6">
                        <div className="flex items-center space-x-4">
                            <img src={platform.logo} alt={platform.name} className="w-16 h-16 rounded-xl object-cover border border-slate-800" />
                            <div>
                                <h1 className="text-3xl font-extrabold text-white">{platform.name}</h1>
                                <p className="text-xs text-emerald-400 font-semibold mt-1">{platform.category}</p>
                            </div>
                        </div>

                        <p className="text-slate-300 text-sm leading-relaxed">{platform.overview}</p>

                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 p-4 bg-slate-950/60 rounded-xl border border-slate-800/80 text-xs">
                            <div>
                                <span className="text-slate-500 block">Earning Potential</span>
                                <span className="font-bold text-white">{platform.earningPotential}</span>
                            </div>
                            <div>
                                <span className="text-slate-500 block">Min. Payout</span>
                                <span className="font-bold text-white">{platform.minPayout}</span>
                            </div>
                            <div>
                                <span className="text-slate-500 block">Payment Methods</span>
                                <span className="font-bold text-white">{platform.paymentMethods}</span>
                            </div>
                        </div>

                        <a 
                            href={platform.affiliateUrl} 
                            target="_blank" 
                            rel="noopener noreferrer"
                            onClick={() => trackOutboundClick(platform.name)}
                            className="inline-flex items-center px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-sm rounded-xl transition shadow-lg shadow-emerald-500/10"
                        >
                            <span>Apply / Visit {platform.name}</span>
                            <i data-lucide="external-link" className="w-4 h-4 ml-2"></i>
                        </a>
                    </div>
                </div>
            );
        }

        // --- COMPARISON PAGE ---
        function ComparePage({ platforms, navigateToDetail }) {
            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                    <h1 className="text-3xl font-extrabold text-white mb-6">Platform Comparison</h1>
                    <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-x-auto">
                        <table className="w-full text-left text-xs">
                            <thead>
                                <tr className="bg-slate-950 border-b border-slate-800 font-semibold uppercase text-slate-400">
                                    <th className="p-4">Platform</th>
                                    <th className="p-4">Category</th>
                                    <th className="p-4">Earning Rate</th>
                                    <th className="p-4">Payment Methods</th>
                                    <th className="p-4">Action</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800">
                                {platforms.map(p => (
                                    <tr key={p.id}>
                                        <td className="p-4 font-bold text-white flex items-center space-x-2">
                                            <img src={p.logo} alt={p.name} className="w-6 h-6 rounded object-cover" />
                                            <span>{p.name}</span>
                                        </td>
                                        <td className="p-4 text-slate-400">{p.category}</td>
                                        <td className="p-4 text-emerald-400 font-semibold">{p.earningPotential}</td>
                                        <td className="p-4 text-slate-400">{p.paymentMethods}</td>
                                        <td className="p-4">
                                            <button onClick={() => navigateToDetail(p.id)} className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded font-bold">Details</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- ADMIN DASHBOARD ---
        function AdminDashboard({ platforms, setPlatforms, analytics, setIsAdminLoggedIn }) {
            const [activeTab, setActiveTab] = useState('analytics');
            const [editingPlatform, setEditingPlatform] = useState(null);
            
            const emptyForm = {
                name: '', category: 'micro-jobs', shortDescription: '', overview: '', typeOfWork: '',
                difficulty: 'Beginner Friendly', earningPotential: '', countries: '', paymentMethods: '',
                minPayout: '', affiliateUrl: '', featured: false, rating: 4.5, verified: true,
                logo: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=120&auto=format&fit=crop&q=80',
                pros: '', cons: '', howItWorks: ''
            };

            const [formData, setFormData] = useState(emptyForm);

            const handleEdit = (p) => {
                setEditingPlatform(p.id);
                setFormData({
                    ...p,
                    logo: p.logo || emptyForm.logo,
                    overview: p.overview || '',
                    typeOfWork: p.typeOfWork || '',
                    difficulty: p.difficulty || 'Beginner Friendly',
                    earningPotential: p.earningPotential || '',
                    countries: p.countries || '',
                    paymentMethods: p.paymentMethods || '',
                    minPayout: p.minPayout || '',
                    howItWorks: p.howItWorks || '',
                    pros: Array.isArray(p.pros) ? p.pros.join(', ') : (p.pros || ''),
                    cons: Array.isArray(p.cons) ? p.cons.join(', ') : (p.cons || '')
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handlePromptImageChange = (p) => {
                const newLogoUrl = prompt('Enter the new Image/Logo URL for ' + p.name + ':', p.logo);
                if (newLogoUrl && newLogoUrl.trim() !== '') {
                    setPlatforms(platforms.map(item => item.id === p.id ? { ...item, logo: newLogoUrl.trim() } : item));
                    if (editingPlatform === p.id) {
                        setFormData(prev => ({ ...prev, logo: newLogoUrl.trim() }));
                    }
                }
            };

            const handleCancelEdit = () => {
                setEditingPlatform(null);
                setFormData(emptyForm);
            };

            const handleDelete = (id) => {
                if (confirm('Are you sure you want to delete this item?')) {
                    if (editingPlatform === id) {
                        handleCancelEdit();
                    }
                    setPlatforms(platforms.filter(p => p.id !== id));
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const processedData = {
                    ...formData,
                    pros: typeof formData.pros === 'string' ? formData.pros.split(',').map(s => s.trim()).filter(Boolean) : formData.pros,
                    cons: typeof formData.cons === 'string' ? formData.cons.split(',').map(s => s.trim()).filter(Boolean) : formData.cons,
                    lastUpdated: new Date().toISOString().split('T')[0]
                };

                if (editingPlatform) {
                    setPlatforms(platforms.map(p => p.id === editingPlatform ? { ...p, ...processedData, id: editingPlatform } : p));
                    setEditingPlatform(null);
                } else {
                    const newEntry = { ...processedData, id: Date.now().toString() };
                    setPlatforms([newEntry, ...platforms]);
                }

                setFormData(emptyForm);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-slate-800 mb-8 gap-4">
                        <div>
                            <span className="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 font-bold text-[10px] rounded-full uppercase tracking-wider border border-emerald-500/20">
                                Restricted Portal
                            </span>
                            <h1 className="text-2xl font-extrabold text-white mt-1">Admin Dashboard & Visitor Analytics</h1>
                        </div>

                        <button onClick={() => setIsAdminLoggedIn(false)} className="px-4 py-2 bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 text-xs font-bold rounded-xl transition">
                            Sign Out
                        </button>
                    </div>

                    {/* Nav Tabs */}
                    <div className="flex space-x-3 mb-8 border-b border-slate-800">
                        <button 
                            onClick={() => setActiveTab('analytics')}
                            className={`pb-3 text-xs font-bold flex items-center space-x-2 border-b-2 transition ${activeTab === 'analytics' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400 hover:text-white'}`}
                        >
                            <i data-lucide="bar-chart-3" className="w-4 h-4"></i>
                            <span>Traffic & Referral Analytics</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('listings')}
                            className={`pb-3 text-xs font-bold flex items-center space-x-2 border-b-2 transition ${activeTab === 'listings' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400 hover:text-white'}`}
                        >
                            <i data-lucide="database" className="w-4 h-4"></i>
                            <span>Listing & Link Manager</span>
                        </button>
                    </div>

                    {/* TAB 1: ANALYTICS */}
                    {activeTab === 'analytics' && (
                        <div className="space-y-8">
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-sm">
                                    <div className="flex justify-between items-center text-slate-400 mb-2">
                                        <span className="text-xs font-bold uppercase tracking-wider">Total Views</span>
                                        <i data-lucide="eye" className="w-5 h-5 text-emerald-400"></i>
                                    </div>
                                    <div className="text-3xl font-black text-white">{analytics.totalViews.toLocaleString()}</div>
                                    <span className="text-[11px] text-emerald-400 font-semibold mt-1 inline-block">Real-time total hits</span>
                                </div>

                                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-sm">
                                    <div className="flex justify-between items-center text-slate-400 mb-2">
                                        <span className="text-xs font-bold uppercase tracking-wider">Unique Visitors</span>
                                        <i data-lucide="users" className="w-5 h-5 text-blue-400"></i>
                                    </div>
                                    <div className="text-3xl font-black text-white">{analytics.uniqueVisitors.toLocaleString()}</div>
                                    <span className="text-[11px] text-slate-500 font-medium mt-1 inline-block">Unique sessions</span>
                                </div>

                                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-sm">
                                    <div className="flex justify-between items-center text-slate-400 mb-2">
                                        <span className="text-xs font-bold uppercase tracking-wider">Outbound Clicks</span>
                                        <i data-lucide="external-link" className="w-5 h-5 text-purple-400"></i>
                                    </div>
                                    <div className="text-3xl font-black text-white">{analytics.linkClicks.toLocaleString()}</div>
                                    <span className="text-[11px] text-purple-400 font-semibold mt-1 inline-block">Affiliate conversions</span>
                                </div>

                                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-sm">
                                    <div className="flex justify-between items-center text-slate-400 mb-2">
                                        <span className="text-xs font-bold uppercase tracking-wider">CTR</span>
                                        <i data-lucide="trending-up" className="w-5 h-5 text-amber-400"></i>
                                    </div>
                                    <div className="text-3xl font-black text-white">
                                        {((analytics.linkClicks / (analytics.totalViews || 1)) * 100).toFixed(1)}%
                                    </div>
                                    <span className="text-[11px] text-amber-400 font-semibold mt-1 inline-block">View to click ratio</span>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                                    <h3 className="font-bold text-white text-sm mb-4">Top Viewed Pages</h3>
                                    <div className="space-y-4">
                                        {Object.entries(analytics.pageBreakdown).map(([page, count]) => {
                                            const pct = Math.round((count / (analytics.totalViews || 1)) * 100);
                                            return (
                                                <div key={page} className="space-y-1">
                                                    <div className="flex justify-between text-xs font-semibold text-slate-300">
                                                        <span className="capitalize">{page}</span>
                                                        <span>{count} views ({pct}%)</span>
                                                    </div>
                                                    <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                                        <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                                    <h3 className="font-bold text-white text-sm mb-4">Top Clicked Referral Platforms</h3>
                                    <div className="space-y-3">
                                        {Object.entries(analytics.topClickedPlatforms).map(([platform, clicks]) => (
                                            <div key={platform} className="p-3 bg-slate-950 rounded-xl flex justify-between items-center text-xs border border-slate-800">
                                                <span className="font-bold text-slate-200">{platform}</span>
                                                <span className="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 font-bold rounded-lg border border-emerald-500/20">{clicks} Clicks</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 2: LISTINGS */}
                    {activeTab === 'listings' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="font-bold text-white text-base">
                                        {editingPlatform ? 'Edit Listing' : 'Add New Entry'}
                                    </h2>
                                    {editingPlatform && (
                                        <button 
                                            type="button" 
                                            onClick={handleCancelEdit} 
                                            className="text-xs text-slate-400 hover:text-slate-200 underline"
                                        >
                                            Cancel
                                        </button>
                                    )}
                                </div>

                                <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-semibold">Platform Name</label>
                                        <input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-semibold">Logo Image URL</label>
                                        <div className="flex space-x-2">
                                            <input required type="url" value={formData.logo} onChange={e => setFormData({...formData, logo: e.target.value})} placeholder="https://images.unsplash.com/..." className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                            {formData.logo && (
                                                <img src={formData.logo} alt="Preview" className="w-10 h-10 rounded-lg object-cover border border-slate-700 flex-shrink-0" />
                                            )}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-semibold">Referral Link URL</label>
                                        <input required type="url" value={formData.affiliateUrl} onChange={e => setFormData({...formData, affiliateUrl: e.target.value})} className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-semibold">Category</label>
                                        <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                            {INITIAL_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-semibold">Short Description</label>
                                        <input required type="text" value={formData.shortDescription} onChange={e => setFormData({...formData, shortDescription: e.target.value})} className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-semibold">Overview Description</label>
                                        <textarea rows="2" value={formData.overview} onChange={e => setFormData({...formData, overview: e.target.value})} className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Full details overview..."></textarea>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-300 mb-1 font-semibold">Earning Potential</label>
                                            <input type="text" value={formData.earningPotential} onChange={e => setFormData({...formData, earningPotential: e.target.value})} placeholder="e.g. $15 - $40 / hr" className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-300 mb-1 font-semibold">Min Payout</label>
                                            <input type="text" value={formData.minPayout} onChange={e => setFormData({...formData, minPayout: e.target.value})} placeholder="e.g. $5.00" className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-semibold">Payment Methods</label>
                                        <input type="text" value={formData.paymentMethods} onChange={e => setFormData({...formData, paymentMethods: e.target.value})} placeholder="e.g. PayPal, AirTM" className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-semibold">Pros (comma separated)</label>
                                        <input type="text" value={formData.pros} onChange={e => setFormData({...formData, pros: e.target.value})} placeholder="Flexible hours, Good rates" className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    <div>
                                        <label className="block text-slate-300 mb-1 font-semibold">Cons (comma separated)</label>
                                        <input type="text" value={formData.cons} onChange={e => setFormData({...formData, cons: e.target.value})} placeholder="Strict checks, Fluctuating work" className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>

                                    <div className="flex items-center space-x-2 pt-2">
                                        <input type="checkbox" id="featuredCheck" checked={formData.featured} onChange={e => setFormData({...formData, featured: e.target.checked})} className="rounded bg-slate-800 border-slate-700 text-emerald-500 focus:ring-emerald-500" />
                                        <label htmlFor="featuredCheck" className="text-slate-300 text-xs">Highlight on Featured Section</label>
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 py-2.5 bg-emerald-500 text-slate-950 font-bold rounded-lg hover:bg-emerald-600 transition">
                                            {editingPlatform ? 'Update Platform' : 'Save Platform'}
                                        </button>
                                        {editingPlatform && (
                                            <button type="button" onClick={handleCancelEdit} className="px-4 py-2.5 bg-slate-800 text-slate-300 font-semibold rounded-lg hover:bg-slate-700 transition">
                                                Cancel
                                            </button>
                                        )}
                                    </div>
                                </form>
                            </div>

                            <div className="lg:col-span-2 space-y-3">
                                <h2 className="font-bold text-white text-base">Active Listings ({platforms.length})</h2>
                                <div className="bg-slate-900 rounded-2xl border border-slate-800 divide-y divide-slate-800 overflow-hidden">
                                    {platforms.map(p => (
                                        <div key={p.id} className={`p-4 flex items-center justify-between transition ${editingPlatform === p.id ? 'bg-emerald-950/20 border-l-4 border-l-emerald-500' : 'hover:bg-slate-800/50'}`}>
                                            <div className="flex items-center space-x-3">
                                                <div className="relative group/img cursor-pointer" onClick={() => handlePromptImageChange(p)} title="Click to change image prompt">
                                                    <img src={p.logo} alt={p.name} className="w-10 h-10 rounded-lg object-cover border border-slate-700" />
                                                    <div className="absolute inset-0 bg-black/60 rounded-lg opacity-0 group-hover/img:opacity-100 flex items-center justify-center text-white transition">
                                                        <i data-lucide="camera" className="w-4 h-4"></i>
                                                    </div>
                                                </div>
                                                <div>
                                                    <div className="flex items-center space-x-2">
                                                        <h4 className="font-bold text-white text-xs">{p.name}</h4>
                                                        {p.featured && <span className="px-1.5 py-0.5 bg-amber-500/20 text-amber-400 text-[9px] font-bold rounded">Featured</span>}
                                                    </div>
                                                    <p className="text-[11px] text-slate-400">{p.category} • <span className="text-emerald-400 font-mono">{p.affiliateUrl}</span></p>
                                                </div>
                                            </div>
                                            <div className="flex items-center space-x-2">
                                                <button 
                                                    onClick={() => handlePromptImageChange(p)} 
                                                    title="Prompt Image Change"
                                                    className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition flex items-center space-x-1"
                                                >
                                                    <i data-lucide="image" className="w-3.5 h-3.5"></i>
                                                    <span className="hidden sm:inline">Change Image</span>
                                                </button>
                                                <button 
                                                    onClick={() => handleEdit(p)} 
                                                    title="Edit Listing"
                                                    className="px-3 py-1.5 bg-slate-800 hover:bg-emerald-500 hover:text-slate-950 text-slate-200 text-xs font-bold rounded-lg transition flex items-center space-x-1"
                                                >
                                                    <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
                                                    <span>Edit</span>
                                                </button>
                                                <button 
                                                    onClick={() => handleDelete(p.id)} 
                                                    title="Delete Listing"
                                                    className="p-1.5 text-slate-400 hover:text-rose-400 rounded"
                                                >
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
